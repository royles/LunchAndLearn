name: Local LLM Chat
description: >-
  React + FastAPI chat application for Cloudera AI Workbench with SQLite history,
  OpenAI-compatible local LLM streaming, and multimodal image support.
author: Cloudera AI Workbench Project
date: "2026-10-12"
specification_version: "1.0"
prototype_version: "0.1.0"
environment_variables:
  CDSW_APP_POLLING_ENDPOINT:
    default: "/healthcheck"
    description: Health endpoint for CML application status polling
  MODEL_TOKEN_ENCRYPTION_KEY:
    default: ""
    description: Fernet key for encrypting model tokens at rest (required to save tokens)
    required: true
  LLM_BASE_URL:
    default: "http://127.0.0.1:11434/v1"
    description: Initial OpenAI-compatible API base URL (overridden by UI settings in SQLite)
  LLM_MODEL:
    default: "llama3.2"
    description: Initial model id (overridden by UI settings in SQLite)
tasks:
  - type: start_application
    subdomain: local-llm-chat
    script: entry.py
    kernel: python3
    environment_variables:
      CDSW_APP_POLLING_ENDPOINT: "/healthcheck"
